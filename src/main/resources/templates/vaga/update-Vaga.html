<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar vaga')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('vagas')}"></aside>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Editar vaga', 'Atualize as informações da oportunidade selecionada.')}"></header>

        <section class="content-container">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <section class="app-card form-card single-form-card">
                <div class="card-heading">
                    <div>
                        <span class="section-kicker">Edição</span>
                        <h2 th:text="${vaga.nome}">Nome da vaga</h2>
                        <p>Faça os ajustes necessários e salve as alterações.</p>
                    </div>
                    <span class="icon-badge"><i class="bi bi-pencil-square"></i></span>
                </div>

                <form th:action="@{/editar-vaga}" method="post" class="needs-validation" novalidate>
                    <input type="hidden" name="codigo" th:value="${vaga.codigo}">

                    <div class="row g-4">
                        <div class="col-12">
                            <label for="nome" class="form-label">Nome da vaga</label>
                            <input id="nome" name="nome" type="text" class="form-control app-input"
                                   th:value="${vaga.nome}" required maxlength="120">
                        </div>

                        <div class="col-12">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea id="descricao" name="descricao" class="form-control app-input"
                                      rows="5" required th:text="${vaga.descricao}"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="salario" class="form-label">Salário</label>
                            <div class="input-group app-input-group">
                                <span class="input-group-text">R$</span>
                                <input id="salario" name="salario" type="text" class="form-control app-input"
                                       th:value="${vaga.salario}" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="data" class="form-label">Data de expiração</label>
                            <input id="data" name="data" type="text" class="form-control app-input"
                                   th:value="${vaga.data}" required>
                            <div class="form-hint">Mantém compatibilidade com o campo String atual do backend.</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/{codigo}(codigo=${vaga.codigo})}" class="btn btn-light app-btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn app-btn-primary">
                            <i class="bi bi-check2-circle"></i>
                            Salvar alterações
                        </button>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
